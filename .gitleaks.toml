# Gitleaks Configuration for SecureML-CI
title = "SecureML-CI Secret Scanning Rules"

[allowlist]
description = "Global allowlist"
paths = [
    '''tests/.*''',
    '''data/.*''',
]

[[rules]]
id = "generic-api-key"
description = "Generic API Key Detection"
regex = '''(?i)(api[_-]?key|secret|token|password)['"\s:=]+['"][a-zA-Z0-9_\-]{16,}['"]'''
secretGroup = 0
entropy = 3.5

[[rules]]
id = "aws-access-token"
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
