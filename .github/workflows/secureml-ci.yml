name: SecureML-CI Automated Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ============================================================================
  # STAGE 1: CODE QUALITY & LINTING
  # ============================================================================
  lint:
    name: 1. Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats formatting/style issues as warnings without failing the build
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

  # ============================================================================
  # STAGE 2: DATA & MODEL QUALITY GATES
  # ============================================================================
  quality-gate:
    name: 2. Data & Model Quality Gates
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Machine Learning Model
        run: |
          python src/train.py --data-path data/heart_disease.csv --model-path models/model.joblib --metrics-path models/metrics.json

      - name: Execute Quality Gate (Data & Accuracy Assertion)
        run: |
          # Enforces minimum 75% accuracy and 70% F1-score. Fails build if below.
          python src/validate.py --data-path data/heart_disease.csv --metrics-path models/metrics.json --min-accuracy 0.75 --min-f1 0.70

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Upload Trained Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-artifacts
          path: models/

  # ============================================================================
  # STAGE 3: SHIFT-LEFT SECURITY SCANNING
  # ============================================================================
  security-scans:
    name: 3. Security Auditing (SAST, Dependencies & Secrets)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 3.1 Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 3.2 Static Application Security Testing (Bandit)
        run: |
          # Scan Python code for security vulnerabilities, unsafe functions, and injections
          bandit -r src/ -ll -ii

      - name: 3.3 Dependency Vulnerability Audit (pip-audit)
        run: |
          # Audit installed packages against official PyPI vulnerability database
          pip-audit -r requirements.txt

  # ============================================================================
  # STAGE 4: DOCKER BUILD & CONTAINER SECURITY (TRIVY)
  # ============================================================================
  docker-build-and-scan:
    name: 4. Docker Build & Image Security Scan
    runs-on: ubuntu-latest
    needs: [quality-gate, security-scans]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Trained Model Artifact
        uses: actions/download-artifact@v4
        with:
          name: ml-model-artifacts
          path: models/

      - name: Build Docker Image
        run: |
          docker build -t secureml-ci-app:latest .

      - name: 4.1 Run Trivy Vulnerability Scanner on Container Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secureml-ci-app:latest"
          format: "table"
          exit-code: "0"  # Set to '1' to fail on CRITICAL CVEs
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ============================================================================
  # STAGE 5: SMOKE TEST DEPLOYMENT & VERIFICATION
  # ============================================================================
  deploy-verification:
    name: 5. Container Deployment & Health Verification
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Trained Model Artifact
        uses: actions/download-artifact@v4
        with:
          name: ml-model-artifacts
          path: models/

      - name: Rebuild and Run Container
        run: |
          docker build -t secureml-ci-app:latest .
          docker run -d -p 8000:8000 --name ml_service secureml-ci-app:latest
          sleep 5

      - name: Test /health Endpoint
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health

      - name: Test /predict Endpoint with Clinical Payload
        run: |
          curl --fail -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 55, "sex": 1, "resting_bp": 130.0, "cholesterol": 240.0, "fasting_bs": 0, "max_heart_rate": 155.0, "exercise_angina": 0, "oldpeak": 1.2}'
